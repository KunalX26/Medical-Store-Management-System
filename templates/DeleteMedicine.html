{% extends 'DeleteMedicineTemp.html' %}
{% block m1 %}

<link href="../static/css/DeleteMedicine.css" rel="stylesheet" type="text/css" />

<div class="full-page">
    <div class="delete-box">
        <h1>Delete Medicine Data</h1>

        {% if vgt %}
        <div class="medicine-info">
            <h3>{{vgt[1]}}</h3>
            <p>
                <b>Medicine Type</b>: {{vgt[2]}} <br/>
                <b>Medicine Company</b>: {{vgt[3]}} <br/>
                <b>Licence No.</b>: {{vgt[4]}} <br/>
                <b>Unit Price (₹)</b>: {{vgt[5]}} <br/>
                <b>Description</b>: {{vgt[6]}}
            </p>
        </div>

        <form class="delete-form" onsubmit="return confirm('Are you sure you want to delete this medicine?')" method="post" action="delete_medicine1">
            <input type="hidden" value="{{vgt[0]}}" name="T1" />
            <button type="submit" class="delete-btn">Delete</button>
        </form>
        {% endif %}

        <div class="back-button-container">
            <a href="show_medicines">
                <button type="button" class="back-btn">Back</button>
            </a>
        </div>
    </div>
</div>

{% endblock %}
