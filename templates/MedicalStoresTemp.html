<html>
<head>
    <title>Medical Stores</title>
    <link rel="stylesheet" href="../static/cyborg/cyborg.css" type="text/css">
    <script src="../static/bootstrap/js/bootstrap.bundle.js"></script>

    <!-- ✅ Include your MedicalStores.css -->
    <link rel="stylesheet" href="../static/css/MedicalStores.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark" style="position: sticky; top: 0; z-index: 1000;">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="../static/images/logo without bg 2.png" alt="MediMap Logo" height="30" style="margin-top: -5;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarColor01" aria-controls="navbarColor01"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Home
                            <span class="visually-hidden">(current)</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="medical_stores">Stores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ✅ This main section will grow to push the footer down -->
    <main class="container" style="flex: 1;">
        {% block m1 %}
        {% endblock %}
    </main>

    <!-- ✅ Footer stays at the end -->
    <footer class="footer">
        <p>© {{ current_year | default(2025) }} <strong>MediMap</strong>. All rights reserved.</p>
        <p>Making healthcare <strong>accessible</strong>, <strong>reliable</strong>, and <strong>convenient</strong>.</p>
    </footer>

</body>
</html>
