{% extends 'MedicalRegTemp.html' %}
{% block m1 %}

<link href="../static/css/MedicalReg.css" rel="stylesheet" type="text/css" />

<div class="registration-container">
    <h1>Medical Registration</h1>
    <form id="medicalForm" method="POST" action="/medical_reg">

        <div class="form-group">
            <label for="medName">Medical Name</label>
            <input type="text" id="medName" name="T1" required>
            <small class="error-message" id="medNameError"></small>
        </div>

        <div class="form-group">
            <label for="ownerName">Owner Name</label>
            <input type="text" id="ownerName" name="T2" required>
            <small class="error-message" id="ownerNameError"></small>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="T3" required>
        </div>

        <div class="form-group">
            <label for="contact">Contact</label>
            <input type="tel" id="contact" name="T4" required>
            <small class="error-message" id="contactError"></small>
        </div>

        <div class="form-group">
            <label for="license">Licence No.</label>
            <input type="text" id="license" name="T5" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="T6" required>
            <small class="error-message" id="emailError"></small>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="T7" required>
            <small class="error-message" id="passwordError"></small>
        </div>

        <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="T8" required>
            <small class="error-message" id="confirmError"></small>
        </div>

        <input type="submit" value="Register">
    </form>

    {% if vgt %}
        <h3>{{ vgt }}</h3>
    {% endif %}

    <p>Already have an account? <a href="/medical_login">Login here</a></p>
</div>

<script>
document.getElementById('medicalForm').addEventListener('submit', function(e) {
    let isValid = true;

    // Clear previous errors
    document.querySelectorAll('.error-message').forEach(el => el.textContent = '');

    // Validation patterns
    const namePattern = /^[A-Za-z\s]+$/;
    const phonePattern = /^[6-9]\d{9}$/;
    const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;

    // Field values
    const medName = document.getElementById('medName').value.trim();
    const ownerName = document.getElementById('ownerName').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    // Medical name validation
    if (!namePattern.test(medName)) {
        document.getElementById('medNameError').textContent = 'Enter a valid medical name.';
        isValid = false;
    }

    // Owner name validation
    if (!namePattern.test(ownerName)) {
        document.getElementById('ownerNameError').textContent = 'Enter a valid owner name.';
        isValid = false;
    }

    // Contact validation
    if (!phonePattern.test(contact)) {
        document.getElementById('contactError').textContent = 'Enter a valid 10-digit contact number.';
        isValid = false;
    }

    // Email validation
    if (!emailPattern.test(email)) {
        document.getElementById('emailError').textContent = 'Please enter a valid email address.';
        isValid = false;
    }

    // Password match validation
    if (password !== confirm) {
        document.getElementById('confirmError').textContent = 'Passwords do not match.';
        isValid = false;
    }

    if (!isValid) {
        e.preventDefault(); // Stop submission
    }
});
</script>

<style>
.error-message {
    color: red;
    font-size: 0.9em;
    display: block;
    margin-top: 4px;
}
</style>

{% endblock %}
