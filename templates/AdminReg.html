{% extends 'AdminRegTemp.html' %}
{% block m1 %}

<link href="../static/css/AdminReg.css" rel="stylesheet" type="text/css" />

<div class="registration-container">
    <h1>Register</h1>
    <form id="registrationForm" method="POST" action="admin_reg">
        <!-- Name -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="T1" required>
            <small class="error-message" id="nameError"></small>
        </div>

        <!-- Address -->
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="T2" required>
            <small class="error-message" id="addressError"></small>
        </div>

        <!-- Contact -->
        <div class="form-group">
            <label for="contact">Contact</label>
            <input type="tel" id="contact" name="T3" required>
            <small class="error-message" id="contactError"></small>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="T4" required>
            <small class="error-message" id="emailError"></small>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="T5" required>
            <small class="error-message" id="passwordError"></small>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" required>
            <small class="error-message" id="confirmError"></small>
        </div>

        <input type="submit" value="Create Account">
    </form>

    <script>
document.getElementById('registrationForm').addEventListener('submit', function(e) {
    let isValid = true;

    // Clear previous errors
    document.querySelectorAll('.error-message').forEach(el => el.textContent = '');

    // Name validation: only letters and spaces
    const name = document.getElementById('name').value.trim();
    const namePattern = /^[A-Za-z\s]+$/;
    if (!namePattern.test(name)) {
        document.getElementById('nameError').textContent = 'Enter correct name';
        isValid = false;
    }

    // Email validation
    const email = document.getElementById('email').value;
    const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$/;
    if (!emailPattern.test(email)) {
        document.getElementById('emailError').textContent = 'Please enter a valid email address.';
        isValid = false;
    }

    // Indian phone number validation
    const phone = document.getElementById('phone').value;
    const phonePattern = /^[6-9]\d{9}$/;
    if (phone && !phonePattern.test(phone)) {
        document.getElementById('phoneError').textContent = 'Enter a valid contact number';
        isValid = false;
    }

    // Password match validation
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) {
        document.getElementById('confirmError').textContent = 'Passwords do not match.';
        isValid = false;
    }

    if (!isValid) {
        e.preventDefault(); // Prevent form submission if validation fails
    }
});
</script>


    <p>Already have an account? <a href="/login">Login here</a></p>
</div>

<style>
.error-message {
    color: red;
    font-size: 0.9em;
    display: block;
    margin-top: 4px;
}
</style>



{% endblock %}
