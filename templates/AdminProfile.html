{% extends 'AdminProfileTemp.html' %}
{% block m1 %}

<link href="../static/css/AdminProfile.css" rel="stylesheet" type="text/css" />

<div class="full-page">
    <div class="profile-box">
        <h1>My Profile</h1>

        {% if data %}
        <form id="profileForm" method="post" action="admin_profile">
            <p>
                <label>Name:</label>
                <input type="text" value="{{data[0]}}" name="T1" id="name" />
                <small class="error-message" id="nameError"></small>
            </p>

            <p>
                <label>Address:</label>
                <input type="text" value="{{data[1]}}" name="T2" id="address" />
            </p>

            <p>
                <label>Contact No.:</label>
                <input type="text" value="{{data[2]}}" name="T3" id="contact" />
                <small class="error-message" id="contactError"></small>
            </p>

            <p>
                <label>Email:</label>
                <input readonly type="text" value="{{data[3]}}" name="T4" id="email" />
            </p>

            <div class="button-wrap">
                <button type="submit">Save Changes</button>
            </div>
        </form>

        {% elif msg %}
        <div class="confirmation-box">
            <h2>✅ {{ msg }}</h2>
            <button onclick="location.href='adminhome'">Go to Dashboard</button>
        </div>
        {% endif %}
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById('profileForm');
    if (!form) return; // Skip validation if not present

    form.addEventListener('submit', function(e) {
        let isValid = true;
        document.querySelectorAll('.error-message').forEach(el => el.textContent = '');

        const name = document.getElementById('name').value.trim();
        const contact = document.getElementById('contact').value.trim();

        const namePattern = /^[A-Za-z\s]+$/;
        const phonePattern = /^[6-9]\d{9}$/;

        if (!namePattern.test(name)) {
            document.getElementById('nameError').textContent = 'Enter a valid name';
            isValid = false;
        }
        if (!phonePattern.test(contact)) {
            document.getElementById('contactError').textContent = 'Enter a valid contact number';
            isValid = false;
        }

        if (!isValid) e.preventDefault();
    });
});
</script>

{% endblock %}
